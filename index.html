<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<title>COSMIA: ORIGIN</title>
<style>
:root{--fg:#e8eeff;--mut:#8b97c4;--ln:#26336a;--cd:rgba(10,16,44,.84);--up:#5eead4;--dn:#ff6b81;--ac:#8f9bff;--ac2:#3f6bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04060f;color:var(--fg);font:14px/1.45 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr.on{display:flex}
.scr>*,#top{pointer-events:auto}
.wrap{width:100%;max-width:520px;padding:0 12px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{padding:12px 16px;border-radius:12px;background:linear-gradient(135deg,var(--ac2),#7a5cff);font-weight:700;color:#fff;box-shadow:0 4px 18px #3f6bff55}
.btn.sub{background:#162052;box-shadow:none;border:1px solid var(--ln)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.35;cursor:default}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gap{gap:10px}.col{display:flex;flex-direction:column;gap:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#18235a;border:1px solid var(--ln)}
.mods{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-weight:600}
#s-galaxy{justify-content:space-between;text-align:center}
.ttl{margin-top:7vh}.ttl h1{margin:0;font-size:clamp(34px,9vw,54px);letter-spacing:.28em;font-weight:800;background:linear-gradient(180deg,#fff,#9fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:.28em}
.ttl div{letter-spacing:.5em;color:var(--ac);font-weight:700;padding-left:.5em}
.hint{margin-bottom:9vh;padding:10px 18px;color:#cfd9ff;background:transparent;animation:pl 2.2s infinite}
@keyframes pl{50%{opacity:.35}}
#s-planet{justify-content:flex-end;padding-bottom:14px}
#s-race{justify-content:flex-start}
#race-scroll{width:100%;max-width:520px;flex:1;overflow-y:auto;padding:0 12px 8px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;background:var(--cd);border:1.5px solid var(--ln);border-radius:12px;padding:9px 10px;font-size:13px}
.opt.sel{border-color:var(--ac);background:#16226a;box-shadow:0 0 0 2px #8f9bff44}
.opt b{font-size:14px}.opt .mods{font-size:12px;margin-top:4px}
h3{margin:14px 0 6px;font-size:14px;color:#cfd9ff}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.sw.sel{border-color:#fff}
input#rname{background:#0d1640;border:1px solid var(--ln);color:#fff;border-radius:10px;padding:10px 12px;font:inherit;width:100%;user-select:text;-webkit-user-select:text}
#sum{width:100%;max-width:520px;padding:8px 12px 12px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0;font-size:12px;text-align:center}
.st div{background:#0d1640;border-radius:8px;padding:4px 2px}.st b{display:block;font-size:14px}
#top{position:absolute;left:0;right:0;top:0;display:none;justify-content:center;padding:calc(env(safe-area-inset-top) + 8px) 10px 0}
#top.on{display:flex}
#top .card{width:100%;max-width:520px;padding:8px 10px}
.res{display:flex;justify-content:space-between;gap:4px;margin-top:4px;font-weight:700;font-size:13px}.res small{display:block;font-weight:400;color:var(--mut);font-size:11px}
#s-play{justify-content:flex-end}
#sheet{width:100%;max-width:520px;max-height:50%;overflow-y:auto;padding:0 10px 10px;-webkit-overflow-scrolling:touch}
.bar{height:8px;border-radius:9px;background:#0d1640;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),#c08bff);width:0}
.bld{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin-top:8px}
.bld .nm{font-weight:700}.cost{font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);background:#101a52f0;border:1px solid var(--ac);border-radius:99px;padding:8px 16px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:#02040acc;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}#modal .card{width:100%;max-width:400px;background:#0b1236}
#s-launch{justify-content:flex-end;padding-bottom:6vh;text-align:center}
#s-launch .card{margin:0 12px;max-width:440px;opacity:0;transition:opacity 1s}#s-launch.show .card{opacity:1}
summary{cursor:pointer;color:#cfd9ff;font-weight:600}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
<div id="s-galaxy" class="scr"><div class="ttl"><h1>COSMIA</h1><div>ORIGIN</div></div><button class="hint" data-act="enter" style="background:none">은하를 눌러 우주로 들어가세요</button></div>
<div id="s-planet" class="scr"></div>
<div id="s-race" class="scr"></div>
<div id="s-play" class="scr"><div id="sheet"></div></div>
<div id="s-launch" class="scr"><div class="card"><h2 style="margin:0 0 6px">🚀 우주 진출 성공</h2><div class="mut" style="margin-bottom:10px">첫 종족이 본진을 떠나 우주로 나아갔습니다.<br>새 행성 탐색·교류 콘텐츠는 다음 단계에서 열립니다.</div><button class="btn" data-act="back-home">본진으로 돌아가기</button></div></div>
<div id="top"><div class="card"></div></div>
</div>
<div id="toast"></div><div id="modal"><div class="card"></div></div>
<script>
'use strict';
// ===== CONFIG: 모든 수치는 여기 (밸런스는 시뮬레이션으로 조정) =====
const CONFIG={save:'cosmia_origin_v1',offlineMax:28800,offlineRate:.5,minMult:.4,eraMult:1.35,popFloor:.6,popGrow:.02,popStart:8,
capBase:20,capHouse:12,capEra:.3,
b:{farm:{n:'농장',ico:'🌾',rate:1,base:{F:10},r:1.14,out:'F'},mine:{n:'광산',ico:'⛏️',rate:.8,base:{F:25},r:1.15,out:'M'},
lab:{n:'연구소',ico:'🔬',rate:.5,base:{M:20},r:1.15,out:'R'},house:{n:'주거지',ico:'🏠',rate:0,base:{F:40,M:15},r:1.17,out:null}},
start:{F:25,M:0,R:0,lv:{farm:1,mine:0,lab:0,house:0}},
eras:[{n:'원시 시대',ico:'🔥'},{n:'농경 시대',ico:'🌱'},{n:'산업 시대',ico:'🏭'},{n:'정보 시대',ico:'💡'},{n:'우주 시대',ico:'🚀'}],
req:[{R:190,pop:15},{R:1440,pop:35},{R:8000,pop:70},{R:35000,pop:120}],
shardMin:1,shardEra:30,reroll:{base:100,step:50,cash:1100}};
const STAT={food:'식량 생산',mineral:'광물 생산',growth:'인구 증가',research:'연구 속도',combat:'전투력',trade:'교류 보상'};
const PLANETS=[
{id:'desert',n:'사막 행성',d:'모래와 광맥의 세계',pal:['#f6c98a','#d9894a','#5a2a18'],blob:['#e8a863','#b8662f','#f2d9a4'],mods:{mineral:30,food:-25,growth:-15}},
{id:'ocean',n:'해양 행성',d:'끝없는 바다로 덮인 세계',pal:['#a9ddff','#2f78d6','#0a2260'],blob:['#3a9be8','#1b5cbf','#9fd0ff'],cloud:1,mods:{food:30,mineral:-30,research:-20}},
{id:'jungle',n:'정글 행성',d:'생명이 넘치는 울창한 세계',pal:['#b6f2a0','#3f9d52','#0c3322'],blob:['#2f8a44','#6cc26a','#1c5a34'],cloud:1,mods:{growth:30,research:-25}},
{id:'ice',n:'빙설 행성',d:'얼음과 눈의 고요한 세계',pal:['#f2fbff','#9cc9e8','#2a4668'],blob:['#d8efff','#7fb0d8','#ffffff'],mods:{research:25,food:-30,growth:-10}},
{id:'volcano',n:'화산 행성',d:'용암이 흐르는 불안정한 세계',pal:['#ffb27a','#c8402a','#2c0a0c'],blob:['#7a1d14','#ff7a2e','#3a0f10'],mods:{combat:25,mineral:15,food:-35}},
{id:'crystal',n:'수정 행성',d:'빛나는 결정으로 뒤덮인 세계',pal:['#e8d8ff','#9b7cf0','#2a1a64'],blob:['#c9b0ff','#7a5cf0','#f4eaff'],mods:{research:20,trade:15,combat:-25,food:-10}}];
const TR=[
{g:'temper',n:'성향',list:[
{id:'warlike',n:'호전적',ico:'⚔️',mods:{combat:25,trade:-30}},{id:'scholar',n:'학구적',ico:'📚',mods:{research:30,combat:-20}},
{id:'social',n:'사교적',ico:'🤝',mods:{trade:30,mineral:-10}},{id:'diligent',n:'근면한',ico:'🛠️',mods:{mineral:20,research:-15}}]},
{g:'body',n:'체형',list:[
{id:'giant',n:'거대형',ico:'🦣',mods:{combat:25,growth:-20,food:-10}},{id:'small',n:'소형',ico:'🐭',mods:{growth:30,combat:-25}},
{id:'aquatic',n:'수생형',ico:'🐙',mods:{food:20,mineral:-15}},{id:'exo',n:'외골격형',ico:'🪲',mods:{combat:15,mineral:10,trade:-15}}]},
{g:'metab',n:'생태',list:[
{id:'photo',n:'광합성',ico:'🌿',mods:{food:25,research:-15}},{id:'lithic',n:'광물섭취',ico:'🪨',mods:{mineral:25,food:-20}},
{id:'omni',n:'잡식',ico:'🍖',mods:{growth:15,mineral:-10}},{id:'energy',n:'에너지체',ico:'⚡',mods:{research:25,growth:-25}}]}];
const COLORS=['#ffd36e','#7fe0ff','#ff8fb0','#9dff9a','#c9a0ff','#ffffff'];
const NAMES=['루미나','아르카','네뷸라','솔라','오르비','카이로','베가','리라'];
const PL=Object.fromEntries(PLANETS.map(p=>[p.id,p]));
const TRM=Object.fromEntries(TR.map(g=>[g.g,Object.fromEntries(g.list.map(o=>[o.id,o]))]));

// ===== 유틸 =====
function rng(seed){let s=seed>>>0;return()=>((s=Math.imul(s^s>>>15,s|1)),(s^=s+Math.imul(s^s>>>7,s|61)),((s^s>>>14)>>>0)/4294967296)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=r=>Math.sqrt(-2*Math.log(1-r()))*Math.cos(6.2832*r());
const fmt=n=>{n=Math.floor(n*10)/10;return n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':n<100?n.toFixed(1):''+Math.floor(n)};
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const $=id=>document.getElementById(id);
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);

// ===== 저장 =====
const mem={};
const store={get(){try{return JSON.parse(localStorage.getItem(CONFIG.save))}catch(e){return mem.d||null}},
set(d){try{localStorage.setItem(CONFIG.save,JSON.stringify(d))}catch(e){mem.d=d}},clear(){try{localStorage.removeItem(CONFIG.save)}catch(e){}mem.d=null}};

// ===== 상태 =====
const S={score:0,scene:'galaxy',st:0,T:0,G:null,shards:0,rerolls:0,mute:false,pend:null,pick:{temper:null,body:null,metab:null,color:0,name:''},parts:null,boomed:false,qty:1,acc:0,uiT:0,saveT:0,lights:0};
function persist(){if(S.noSave)return;store.set({version:1,G:S.G,shards:S.shards,rerolls:S.rerolls,mute:S.mute})}

// ===== 오디오(절차 생성) =====
let ac=null;
function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(f=440,d=.08,type='sine',v=.06,f2){if(S.mute)return;try{unlockAudio();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function boom(){beep(90,1.4,'sawtooth',.16,25);beep(300,.5,'triangle',.05,40)}

// ===== 캔버스 =====
const cv=$('c'),ctx=cv.getContext('2d');let W=360,H=640,dpr=1,bgc=null;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;const g=bgc.getContext('2d'),r=rng(42);
for(let i=0;i<Math.floor(W*H/2600);i++){const s=r();g.fillStyle=`rgba(${190+r()*65|0},${200+r()*55|0},255,${.15+r()*.55})`;g.fillRect(r()*W,r()*H,s<.9?1:1.8,s<.9?1:1.8)}}
addEventListener('resize',resize);resize();

// ===== 은하계 스프라이트 (LHY Space 은하 방식: 2개 팔·감김 5.4·눕힘·반시계 회전) =====
let GAL=null;
function makeGalaxy(){const Z=1024,c=document.createElement('canvas');c.width=c.height=Z;const g=c.getContext('2d'),r=rng(777),half=Z/2,up=half/1.12;
const P=[[255,243,220],[191,216,255],[63,107,255],[143,107,255]],tw=5.4;g.globalCompositeOperation='lighter';
const pt=()=>{const t=r();let x,y,rad,a;if(t<.12){rad=Math.sqrt(r())*1.05;a=r()*6.2832}else if(t<.3){rad=Math.abs(gauss(r))*.17;a=r()*6.2832}else{rad=Math.pow(r(),.8);a=(r()<.5?0:Math.PI)+rad*tw+gauss(r)*(.09+.3*rad)}return[Math.cos(a)*rad,Math.sin(a)*rad,rad]};
for(let i=0;i<520;i++){const[x,y,rd]=pt();if(rd<.25)continue;const px=half+x*up,py=half+y*up,R=(.06+r()*.14)*up,col=P[rd<.5?1:2],gr=g.createRadialGradient(px,py,0,px,py,R);gr.addColorStop(0,`rgba(${col},${.05+r()*.05})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(px-R,py-R,R*2,R*2)}
const cg=g.createRadialGradient(half,half,0,half,half,up*.45);cg.addColorStop(0,'rgba(255,243,220,.7)');cg.addColorStop(.3,'rgba(191,216,255,.25)');cg.addColorStop(1,'rgba(63,107,255,0)');g.fillStyle=cg;g.fillRect(0,0,Z,Z);
for(let i=0;i<60000;i++){const[x,y,rl]=pt(),q=r(),ci=q<.08?3:rl<.16?(q<.7?0:1):rl<.55?(q<.6?1:2):(q<.75?2:1),lv=r(),al=lv<.5?.35:lv<.86?.65:1,s=r(),sz=s<.85?1:s<.97?1.7:2.6;
g.fillStyle=`rgba(${P[ci]},${al})`;g.fillRect(half+x*up,half+y*up,sz,sz)}
GAL=c}

// ===== 행성 렌더 =====
function drawPlanet(g,cx,cy,R,P,t,o){o=o||{};const T=PL[P.type],rr=rng(P.seed);
let ag=g.createRadialGradient(cx,cy,R*.85,cx,cy,R*1.4);ag.addColorStop(0,rgba(T.pal[0],.4));ag.addColorStop(1,rgba(T.pal[0],0));g.fillStyle=ag;g.fillRect(cx-R*1.5,cy-R*1.5,R*3,R*3);
g.save();g.beginPath();g.arc(cx,cy,R,0,6.2832);g.clip();
const bg=g.createLinearGradient(cx-R,cy-R,cx+R,cy+R);bg.addColorStop(0,T.pal[0]);bg.addColorStop(.5,T.pal[1]);bg.addColorStop(1,T.pal[2]);g.fillStyle=bg;g.fillRect(cx-R,cy-R,R*2,R*2);
for(let k=0;k<38;k++){const bx=rr(),by=rr(),bs=rr(),col=T.blob[(rr()*T.blob.length)|0],u=((bx+t*.012*(.6+bs))%1+1)%1,x=cx+(u*2-1)*R*1.3,y=cy+(by*2-1)*R*.92,w=R*(.12+bs*.3),h=w*(.4+rr()*.5);
g.globalAlpha=.55;g.fillStyle=col;g.beginPath();g.ellipse(x,y,w,h,0,0,6.2832);g.fill()}
if(T.cloud){for(let k=0;k<16;k++){const bx=rr(),by=rr(),u=((bx+t*.03)%1+1)%1,x=cx+(u*2-1)*R*1.3,y=cy+(by*2-1)*R*.9,w=R*(.15+rr()*.22);g.globalAlpha=.22;g.fillStyle='#fff';g.beginPath();g.ellipse(x,y,w,w*.3,0,0,6.2832);g.fill()}}
g.globalAlpha=1;const sh=g.createRadialGradient(cx-R*.4,cy-R*.4,R*.15,cx-R*.1,cy-R*.1,R*1.3);sh.addColorStop(0,'rgba(0,0,12,0)');sh.addColorStop(.55,'rgba(0,0,12,.25)');sh.addColorStop(1,'rgba(0,0,12,.88)');g.fillStyle=sh;g.fillRect(cx-R,cy-R,R*2,R*2);
if(o.lights>0){const r2=rng(P.seed+99);let n=0,tries=0;g.fillStyle=o.lc||'#ffd36e';while(n<o.lights&&tries<4000){tries++;const a=r2()*6.2832,d=Math.sqrt(r2())*R*.95,x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;if((x-cx)+(y-cy)<R*.1)continue;n++;g.globalAlpha=.55+.45*Math.sin(t*2+n);g.fillRect(x,y,R>60?2:1.5,R>60?2:1.5)}g.globalAlpha=1}
g.restore();g.strokeStyle=rgba(T.pal[0],.35);g.lineWidth=1.5;g.beginPath();g.arc(cx,cy,R,Math.PI*1.05,Math.PI*1.6);g.stroke();
if(o.era>=2){const n=(o.era-1)*2;g.fillStyle='#cfe3ff';for(let i=0;i<n;i++){const a=t*(.35+i*.04)+i*6.28/n,rx=R*(1.28+(i%3)*.12),x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*rx*.28;if(Math.sin(a)<0&&Math.abs(x-cx)<R)continue;g.fillRect(x-1,y-1,2.4,2.4)}}
if(o.era>=4){g.strokeStyle='rgba(160,200,255,.35)';g.beginPath();g.ellipse(cx,cy,R*1.5,R*.4,0,0,6.2832);g.stroke()}}

// ===== 경제 =====
const totalsOf=(pt,race)=>{const t={food:0,mineral:0,growth:0,research:0,combat:0,trade:0},add=m=>{for(const k in m)t[k]+=m[k]};add(PL[pt].mods);for(const g in race){if(TRM[g]&&TRM[g][race[g]])add(TRM[g][race[g]].mods)}return t};
const mult=(t,k)=>Math.max(CONFIG.minMult,1+t[k]/100);
const capOf=G=>Math.floor((CONFIG.capBase+CONFIG.capHouse*G.lv.house)*(1+CONFIG.capEra*G.era));
function rates(G){const t=totalsOf(G.planet.type,G.race),cap=capOf(G),pf=CONFIG.popFloor+(1-CONFIG.popFloor)*Math.min(1,G.pop/cap),em=Math.pow(CONFIG.eraMult,G.era),b=CONFIG.b;
return{t,cap,pf,em,F:b.farm.rate*G.lv.farm*mult(t,'food')*pf*em,M:b.mine.rate*G.lv.mine*mult(t,'mineral')*pf*em,R:b.lab.rate*G.lv.lab*mult(t,'research')*pf*em,g:CONFIG.popGrow*mult(t,'growth')}}
function tickEcon(G,dt,k){k=k||1;while(dt>1e-9){const h=Math.min(dt,2),r=rates(G);G.res.F+=r.F*h*k;G.res.M+=r.M*h*k;G.res.R+=r.R*h*k;G.pop=Math.min(r.cap,G.pop+r.g*G.pop*(1-G.pop/r.cap)*h);G.playSec+=h;dt-=h}}
const costOf=(id,L)=>{const b=CONFIG.b[id],o={};for(const c in b.base)o[c]=Math.ceil(b.base[c]*Math.pow(b.r,L));return o};
function buy(G,id,n){let c=0;while(c<n){const o=costOf(id,G.lv[id]);let ok=true;for(const k in o)if(G.res[k]<o[k])ok=false;if(!ok)break;for(const k in o)G.res[k]-=o[k];G.lv[id]++;c++}return c}
const canAdv=G=>G.era<4&&G.res.R>=CONFIG.req[G.era].R&&G.pop>=CONFIG.req[G.era].pop;
function advance(G){if(!canAdv(G))return false;G.res.R-=CONFIG.req[G.era].R;G.era++;S.shards+=CONFIG.shardEra;if(G.era===4)G.launched=true;return true}
function newG(planet,race){return{planet,race,res:{F:CONFIG.start.F,M:CONFIG.start.M,R:CONFIG.start.R},pop:CONFIG.popStart,lv:Object.assign({},CONFIG.start.lv),era:0,playSec:0,lastSeen:Date.now(),launched:false}}

// ===== UI 헬퍼 =====
const modLine=(k,v)=>`<span class="${v>0?'up':'dn'}">${v>0?'▲':'▼'} ${STAT[k]} ${v>0?'+':'−'}${Math.abs(v)}%</span>`;
const modsHTML=m=>Object.entries(m).sort((a,b)=>a[1]-b[1]).map(([k,v])=>modLine(k,v)).join('');
let toastT=0;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2200)}
function modal(h){const m=$('modal');m.firstElementChild.innerHTML=h;m.classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
const SC={galaxy:'s-galaxy',planet:'s-planet',race:'s-race',play:'s-play',launch:'s-launch'};
function setScene(n){S.scene=n;S.st=0;S.parts=null;S.boomed=false;for(const k in SC)$(SC[k]).classList.toggle('on',SC[k]===SC[n]&&!!SC[n]);$('top').classList.toggle('on',n==='play');$('s-launch').classList.remove('show')}

// ===== 흐름 =====
function enter(){if(S.scene!=='galaxy')return;unlockAudio();beep(220,.9,'sine',.05,880);setScene('zoom')}
function rollPlanet(seed){seed=seed==null?Math.floor(Math.random()*1e9):seed;const r=rng(seed);const type=PLANETS[(r()*PLANETS.length)|0].id;S.pend={type,seed,name:'코스미아-'+seed.toString(36).slice(0,3).toUpperCase()}}
function renderPlanet(){const P=S.pend,T=PL[P.type];$('s-planet').innerHTML=`<div class="wrap col"><div class="card"><div class="row"><b style="font-size:17px">${P.name}</b><span class="tag">${T.n}</span></div><div class="mut">${T.d}</div><div class="mods">${modsHTML(T.mods)}</div></div><div class="row gap"><button class="btn sub" data-act="reroll" style="flex:1">🎲 다시 뽑기</button><button class="btn" data-act="planet-ok" style="flex:2">이 행성으로 결정</button></div></div>`}
function rerollCost(){return CONFIG.reroll.base+CONFIG.reroll.step*S.rerolls}
function openReroll(){const c=rerollCost();modal(`<b style="font-size:16px">행성 다시 뽑기</b><div class="mut" style="margin:6px 0 10px">지금 행성은 사라지고 새 행성이 랜덤으로 생성됩니다.<br>다시 뽑을수록 필요량이 늘어납니다.</div><div class="col"><button class="btn" data-act="reroll-shard" ${S.shards<c?'disabled':''}>⭐ 별의 조각 ${c}개 사용 (보유 ${fmt(S.shards)})</button><button class="btn sub" data-act="reroll-cash">💳 ₩${CONFIG.reroll.cash.toLocaleString()} 결제로 뽑기<br><small class="mut">프로토타입: 실제 결제 없이 적용됩니다</small></button><button class="btn sub" data-act="close">닫기</button></div>`)}
function doReroll(){S.rerolls++;closeModal();beep(300,.5,'triangle',.05,900);rollPlanet();S.flash=1;renderPlanet()}
function initRace(){S.pick={temper:null,body:null,metab:null,color:0,name:NAMES[(Math.random()*NAMES.length)|0]};const P=S.pend,T=PL[P.type];
$('s-race').innerHTML=`<div id="race-scroll"><div class="card" style="margin-top:10px"><div class="row"><b>${P.name}</b><span class="tag">${T.n}</span></div><div class="mods" style="font-size:12px">${modsHTML(T.mods)}</div></div>
<h3>종족 이름</h3><input id="rname" maxlength="8" value="${S.pick.name}">
${TR.map(g=>`<h3>${g.n}</h3><div class="grid">${g.list.map(o=>`<button class="opt" data-act="pick" data-g="${g.g}" data-id="${o.id}"><b>${o.ico} ${o.n}</b><div class="mods">${modsHTML(o.mods)}</div></button>`).join('')}</div>`).join('')}
<h3>문명의 빛 색상 <span class="mut" style="font-weight:400">(능력치 영향 없음)</span></h3><div class="row" style="justify-content:flex-start">${COLORS.map((c,i)=>`<button class="sw" data-act="color" data-i="${i}" style="background:${c}"></button>`).join('')}</div><div style="height:8px"></div></div>
<div id="sum" class="card" style="border-radius:14px 14px 0 0"></div>`;
$('rname').addEventListener('input',e=>{S.pick.name=e.target.value.trim();updRace()});updRace()}
function updRace(){const p=S.pick,race={temper:p.temper,body:p.body,metab:p.metab},t=totalsOf(S.pend.type,race);
document.querySelectorAll('#s-race .opt').forEach(b=>b.classList.toggle('sel',p[b.dataset.g]===b.dataset.id));
document.querySelectorAll('#s-race .sw').forEach(b=>b.classList.toggle('sel',+b.dataset.i===p.color));
const dn=Object.entries(t).filter(e=>e[1]<0).sort((a,b)=>a[1]-b[1]),up=Object.entries(t).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
const cell=(k,v)=>`<div><span class="mut">${STAT[k]}</span><b class="${v>0?'up':v<0?'dn':'mut'}">${v>0?'▲ +':v<0?'▼ −':''}${Math.abs(v)}%</b></div>`;
const ok=p.temper&&p.body&&p.metab&&p.name.length>0;
$('sum').innerHTML=`<div class="st">${Object.keys(STAT).map(k=>cell(k,t[k])).join('')}</div><div style="font-size:12px"><span class="dn">⚠ 패널티 합계: ${dn.length?dn.map(([k,v])=>`${STAT[k]} −${-v}%`).join(' · '):'없음'}</span><br><span class="up">✔ 보너스 합계: ${up.length?up.map(([k,v])=>`${STAT[k]} +${v}%`).join(' · '):'없음'}</span></div><button class="btn" data-act="race-ok" style="width:100%;margin-top:8px" ${ok?'':'disabled'}>${ok?'종족 확정 · 문명 시작':'성향·체형·생태를 모두 선택하세요'}</button>`}
function startGame(){const p=S.pick;S.G=newG({type:S.pend.type,seed:S.pend.seed,name:S.pend.name},{name:p.name,color:p.color,temper:p.temper,body:p.body,metab:p.metab});S.rerolls=0;persist();enterPlay();beep(520,.3,'sine',.06,1040)}
function enterPlay(){setScene('play');buildPlay();refreshPlay()}
function buildPlay(){const G=S.G;$('top').firstElementChild.innerHTML=`<div class="row"><b id="who"></b><span><button class="btn sub sm" data-act="settings">⚙</button></span></div><div class="res"><div>🌾<span id="rF"></span><small id="rFs"></small></div><div>🪨<span id="rM"></span><small id="rMs"></small></div><div>🔬<span id="rR"></span><small id="rRs"></small></div><div>👥<span id="rP"></span><small id="rPs"></small></div><div>⭐<span id="rS"></span><small>별의 조각</small></div></div>`;
$('sheet').innerHTML=`<div class="card" id="eraC"></div><div class="row" style="margin:8px 0 0"><span class="mut">강화 수량</span><span>${[1,10,'max'].map(q=>`<button class="btn sub sm" data-act="qty" data-q="${q}" style="margin-left:4px">${q==='max'?'최대':'×'+q}</button>`).join('')}</span></div>
${Object.keys(CONFIG.b).map(id=>`<div class="card bld"><div><span class="nm">${CONFIG.b[id].ico} ${CONFIG.b[id].n}</span> <span class="tag" id="L_${id}"></span><div class="cost" id="E_${id}"></div></div><button class="btn sm" data-act="buy" data-id="${id}" id="B_${id}"></button></div>`).join('')}
<details class="card" style="margin-top:8px"><summary>종족·행성 보정 보기</summary><div class="mods" id="modsum" style="margin-top:8px"></div></details>`;
const r=G.race,t=totalsOf(G.planet.type,r),dn=Object.entries(t).filter(e=>e[1]!==0).sort((a,b)=>a[1]-b[1]);$('modsum').innerHTML=dn.map(([k,v])=>modLine(k,v)).join('')+'<div class="mut" style="font-weight:400;font-size:12px;margin-top:4px">전투력·교류 보상은 해당 콘텐츠가 열릴 때 적용됩니다.</div>'}
function refreshPlay(){const G=S.G;if(!G)return;const r=rates(G),req=CONFIG.req[G.era],e=CONFIG.eras[G.era];
$('who').textContent=`${G.race.name}족 · ${G.planet.name}`;$('rF').textContent=fmt(G.res.F);$('rM').textContent=fmt(G.res.M);$('rR').textContent=fmt(G.res.R);$('rP').textContent=Math.floor(G.pop);$('rS').textContent=fmt(S.shards);
$('rFs').textContent='+'+fmt(r.F)+'/s';$('rMs').textContent='+'+fmt(r.M)+'/s';$('rRs').textContent='+'+fmt(r.R)+'/s';$('rPs').textContent='한계 '+r.cap;
if(req){const pr=Math.min(1,G.res.R/req.R);$('eraC').innerHTML=`<div class="row"><b>${e.ico} ${e.n}</b><span class="mut">생산 ×${r.em.toFixed(2)}</span></div><div class="bar"><i style="width:${pr*100}%"></i></div><div class="row"><span class="cost">연구 ${fmt(G.res.R)}/${req.R} · 인구 ${Math.floor(G.pop)}/${req.pop}</span><button class="btn sm" data-act="advance" ${canAdv(G)?'':'disabled'}>${G.era===3?'🚀 우주 진출':'발전'}</button></div>`}
else $('eraC').innerHTML=`<div class="row"><b>${e.ico} ${e.n}</b><span class="mut">생산 ×${r.em.toFixed(2)}</span></div><div class="cost" style="margin-top:4px">본진은 계속 성장합니다. 새 행성 탐색·교류는 다음 단계에서 열립니다.</div>`;
document.querySelectorAll('[data-act=qty]').forEach(b=>b.style.outline=(''+S.qty===b.dataset.q)?'2px solid var(--ac)':'none');
for(const id in CONFIG.b){const b=CONFIG.b[id],L=G.lv[id];$('L_'+id).textContent='Lv '+L;
const unit=id==='house'?0:b.rate*mult(r.t,{F:'food',M:'mineral',R:'research'}[b.out])*r.pf*r.em;
$('E_'+id).textContent=id==='house'?`인구 한계 ${r.cap} → ${Math.floor((CONFIG.capBase+CONFIG.capHouse*(L+1))*(1+CONFIG.capEra*G.era))}`:`${b.out==='F'?'식량':b.out==='M'?'광물':'연구'} ${fmt(L*unit)}/s → ${fmt((L+1)*unit)}/s`;
let n=S.qty==='max'?999:S.qty,tot={},L2=L,cnt=0,av=Object.assign({},G.res);
while(cnt<n){const o=costOf(id,L2);let ok=true;for(const k in o)if(av[k]<o[k])ok=false;if(!ok&&cnt>0)break;if(!ok&&cnt===0){for(const k in o)tot[k]=o[k];break}for(const k in o){av[k]-=o[k];tot[k]=(tot[k]||0)+o[k]}L2++;cnt++;if(n===999&&cnt>400)break}
const aff=Object.keys(tot).every(k=>G.res[k]>=tot[k]);$('B_'+id).innerHTML=Object.entries(tot).map(([k,v])=>({F:'🌾',M:'🪨'}[k])+fmt(v)).join(' ');$('B_'+id).disabled=!aff||cnt===0&&!aff}}
function offlineGain(G){const away=Math.min((Date.now()-G.lastSeen)/1000,CONFIG.offlineMax);if(away<60)return;const b=Object.assign({},G.res),p0=G.pop;tickEcon(G,away,CONFIG.offlineRate);
modal(`<b style="font-size:16px">🌙 휴식 보너스</b><div class="mut" style="margin:6px 0 10px">자리를 비운 ${Math.floor(away/60)}분 동안 문명이 성장했습니다.</div><div class="col"><div class="row"><span>🌾 식량</span><b class="up">+${fmt(G.res.F-b.F)}</b></div><div class="row"><span>🪨 광물</span><b class="up">+${fmt(G.res.M-b.M)}</b></div><div class="row"><span>🔬 연구</span><b class="up">+${fmt(G.res.R-b.R)}</b></div><div class="row"><span>👥 인구</span><b class="up">+${Math.floor(G.pop-p0)}</b></div><button class="btn" data-act="close">확인</button></div>`)}
function settings(){modal(`<b style="font-size:16px">설정</b><div class="col" style="margin-top:10px"><button class="btn sub" data-act="mute">${S.mute?'🔇 소리 꺼짐':'🔊 소리 켜짐'}</button><button class="btn sub" data-act="reset" id="rstb">🗑 처음부터 다시 시작</button><button class="btn" data-act="close">닫기</button></div>`)}

// ===== 입력 =====
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;unlockAudio();const a=b.dataset.act;
if(a==='enter')enter();else if(a==='close')closeModal();
else if(a==='reroll')openReroll();
else if(a==='reroll-shard'){const c=rerollCost();if(S.shards>=c){S.shards-=c;doReroll()}}
else if(a==='reroll-cash')doReroll();
else if(a==='planet-ok'){setScene('race');initRace();beep(440,.2,'sine',.05,660)}
else if(a==='pick'){S.pick[b.dataset.g]=b.dataset.id;beep(520,.06,'sine',.04);updRace()}
else if(a==='color'){S.pick.color=+b.dataset.i;updRace()}
else if(a==='race-ok'){startGame()}
else if(a==='qty'){S.qty=b.dataset.q==='max'?'max':+b.dataset.q;refreshPlay()}
else if(a==='buy'){const n=S.qty==='max'?999:S.qty,c=buy(S.G,b.dataset.id,n);if(c)beep(600+c*10,.08,'triangle',.05);refreshPlay();persist()}
else if(a==='advance'){if(advance(S.G)){boom();toast(S.G.era===4?'🚀 우주로 진출합니다':'✨ '+CONFIG.eras[S.G.era].n+' 도달! 생산량 증가');persist();if(S.G.era===4){setScene('launch');S.parts=[]}else refreshPlay()}}
else if(a==='back-home'){enterPlay()}
else if(a==='settings')settings();
else if(a==='mute'){S.mute=!S.mute;persist();settings()}
else if(a==='reset'){if(b.dataset.s){store.clear();S.G=null;S.shards=0;S.rerolls=0;closeModal();setScene('galaxy')}else{b.dataset.s=1;b.textContent='⚠ 한 번 더 누르면 모든 진행이 삭제됩니다'}}});
cv.addEventListener('pointerdown',()=>{unlockAudio();if(S.scene==='galaxy')enter();else if(S.scene==='bang'&&S.st>1.4)S.st=Math.max(S.st,5.3)});

// ===== 업데이트 =====
function spawnBang(){const r=rng(S.pend.seed),T=PL[S.pend.type],cols=[...T.pal,...T.blob,'#ffffff','#ffe6b0'],k=Math.min(W,H)/700;S.parts=[];for(let i=0;i<420;i++){const a=r()*6.2832,v=(60+r()*520)*k;S.parts.push({x:0,y:0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[(r()*cols.length)|0],s:1+r()*2})}}
function update(dt){S.st+=dt;S.T+=dt;
if(S.scene==='zoom'&&S.st>1.8){rollPlanet(S.seedOverride);S.seedOverride=null;setScene('bang')}
else if(S.scene==='bang'){const t=S.st;if(t>.95&&!S.boomed){S.boomed=true;boom();spawnBang()}
if(S.parts){const pull=t>2.6?clamp((t-2.6)/1.6,0,1):0;for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;const dm=Math.pow(.5,dt*1.6);p.vx*=dm;p.vy*=dm;if(pull){p.vx-=p.x*pull*9*dt;p.vy-=p.y*pull*9*dt}}}
if(t>5.2){renderPlanet();setScene('planet')}}
else if(S.scene==='launch'){if(S.st>5)$('s-launch').classList.add('show');if(S.st>.6&&S.st<3.2&&S.parts)for(let i=0;i<4;i++)S.parts.push({x:(Math.random()-.5)*8,y:0,vx:(Math.random()-.5)*40,vy:80+Math.random()*80,l:1,c:Math.random()<.5?'#ffb347':'#fff'});if(S.parts){for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.y+=p.vy*dt;p.x+=p.vx*dt;p.l-=dt;if(p.l<=0)S.parts.splice(i,1)}}}
if(S.flash)S.flash=Math.max(0,S.flash-dt*2);
if((S.scene==='play'||S.scene==='launch')&&S.G){tickEcon(S.G,dt);const G=S.G;G.lastSeen=Date.now();S.shardAcc=(S.shardAcc||0)+dt;if(S.shardAcc>=60){S.shardAcc-=60;S.shards+=CONFIG.shardMin}
S.uiT+=dt;if(S.uiT>.25&&S.scene==='play'){S.uiT=0;refreshPlay()}S.saveT+=dt;if(S.saveT>5){S.saveT=0;persist()}}}

// ===== 렌더 =====
function drawGalaxy(k,rotMul){const D=Math.min(W*1.02,H*.72)*k;ctx.save();ctx.translate(W/2,H*.5);ctx.globalCompositeOperation='lighter';ctx.scale(1,.58);ctx.rotate(-S.T*.06*rotMul);ctx.drawImage(GAL,-D/2,-D/2,D,D);ctx.restore()}
function planetPos(){const top=96,bot=H*.5,R=clamp(Math.min(W*.28,(bot-top)*.42),50,150);return{x:W/2,y:(top+bot)/2+4,R}}
function draw(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#04060f';ctx.fillRect(0,0,W,H);ctx.drawImage(bgc,0,0,W,H);
const sc=S.scene,t=S.st;
if(sc==='galaxy'){drawGalaxy(1+.015*Math.sin(S.T*.8),1)}
else if(sc==='zoom'){const p=t/1.8;drawGalaxy(1+Math.pow(p,2.5)*20,1+p*6);ctx.fillStyle=`rgba(255,255,255,${clamp((p-.65)/.35,0,1)})`;ctx.fillRect(0,0,W,H)}
else if(sc==='bang'){const cx=W/2,cy=H*.42,T=PL[S.pend.type],M=Math.min(W,H);
if(t<1){const r=3+t*12+Math.sin(t*40)*1.5,g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*5);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(150,180,255,0)');ctx.fillStyle=g;ctx.fillRect(cx-r*5,cy-r*5,r*10,r*10)}
if(t>.95){const e=t-.95;for(let k=0;k<3;k++){const rr=(e-k*.25)*M*.55;if(rr>0){ctx.strokeStyle=rgba(T.pal[0],clamp(.7-rr/M*.8,0,.7));ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,rr,0,6.2832);ctx.stroke()}}
const ng=ctx.createRadialGradient(cx,cy,0,cx,cy,M*.5*ease(e/2));ng.addColorStop(0,rgba(T.pal[1],.35*clamp(1-e/3.5,0,1)));ng.addColorStop(1,rgba(T.pal[2],0));ctx.fillStyle=ng;ctx.fillRect(0,0,W,H)}
if(S.parts){ctx.globalCompositeOperation='lighter';for(const p of S.parts){ctx.fillStyle=p.c;ctx.globalAlpha=t>3.6?clamp(1-(t-3.6)/1.2,0,1):1;ctx.fillRect(cx+p.x,cy+p.y,p.s,p.s)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
if(t>3.2){const R=Math.min(W*.3,H*.17,150)*ease((t-3.2)/1.6);if(R>1)drawPlanet(ctx,cx,cy,R,S.pend,S.T)}
if(t>.9&&t<1.6){ctx.fillStyle=`rgba(255,255,255,${1-(t-.9)/.7})`;ctx.fillRect(0,0,W,H)}}
else if(sc==='planet'){const R=Math.min(W*.3,H*.17,150);drawPlanet(ctx,W/2,H*.3,R,S.pend,S.T);if(S.flash){ctx.fillStyle=`rgba(255,255,255,${S.flash})`;ctx.fillRect(0,0,W,H)}}
else if(sc==='race'){drawPlanet(ctx,W-44,40,30,S.pend,S.T)}
else if(sc==='play'&&S.G){const G=S.G,pp=planetPos(),r=rates(G);drawPlanet(ctx,pp.x,pp.y,pp.R,G.planet,S.T,{lights:Math.min(140,Math.floor(G.pop*.7+G.era*12)),lc:COLORS[G.race.color],era:G.era})}
else if(sc==='launch'&&S.G){const G=S.G,pp=planetPos();

ctx.fillStyle='#cfe3ff';ctx.font='12px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('본진',hx+12,hy+4);ctx.fillStyle='#6f7fb8';[[-.3,-.1],[.15,-.22],[-.1,.2],[.45,-.05]].forEach(([dx,dy])=>{ctx.fillText('?',W/2+R2*dx*1.8,H*.5+R2*dy*.8)});ctx.globalAlpha=1}}}
