<style>
:root{
  --ice:#EAF4FF; --sky:#6FB3FF; --muted:rgba(234,244,255,.66); --line:rgba(255,255,255,.22);
  --body:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --display:'Sora','Pretendard Variable',Pretendard,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#050E24;color:var(--ice);font-family:var(--body);color-scheme:dark}
body{background:
  radial-gradient(70% 60% at 50% 55%, rgba(30,70,190,.34), transparent 70%),
  radial-gradient(50% 40% at 85% 10%, rgba(47,107,255,.2), transparent 70%),
  linear-gradient(180deg,#050E24,#07142F 60%,#050E24)}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:manipulation}
#sky.go{cursor:pointer}

#welcome{
  position:fixed;left:0;right:0;top:calc(7vh + env(safe-area-inset-top));text-align:center;pointer-events:none;
  font-weight:700;font-size:clamp(24px,3.4vw,40px);letter-spacing:.5em;text-indent:.5em;
  text-shadow:0 0 28px rgba(111,179,255,.75),0 0 4px rgba(255,255,255,.4);
  opacity:0;transform:translateY(-6px);
  transition:opacity 1.6s ease 1.9s, transform 1.6s ease 1.9s, letter-spacing 2.2s cubic-bezier(.2,.7,.2,1) 1.9s, text-indent 2.2s cubic-bezier(.2,.7,.2,1) 1.9s;
}
#welcome.show{opacity:1;transform:none;letter-spacing:.1em;text-indent:.1em}
#welcome.hide{opacity:0;transform:translateY(-10px);transition:opacity .6s ease, transform .6s ease}

#bar{
  position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(22px + env(safe-area-inset-top)) clamp(18px,3.4vw,52px) 0;pointer-events:none;
  opacity:0;animation:fadein 1.4s ease 1.6s forwards;
}
@keyframes fadein{to{opacity:1}}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#back{opacity:0;pointer-events:none;transition:opacity .8s ease,background .25s}
#bar.on #back{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;pointer-events:auto}
.mk{position:relative;display:block;width:34px;height:34px;font-style:normal}
.mk img{position:absolute;left:2px;top:2px;width:30px;height:30px;filter:drop-shadow(0 0 14px rgba(80,140,255,.7))}
.wm{height:16px;width:auto;display:block;color:#fff;overflow:visible;filter:drop-shadow(0 0 10px rgba(110,165,255,.6))}
.lhy{font:italic 700 20px/1 var(--display);letter-spacing:.02em;padding-right:.1em;color:#fff;filter:drop-shadow(0 0 10px rgba(110,165,255,.6))}



#tag{
  position:fixed;left:clamp(18px,3.4vw,52px);top:clamp(120px,17vh,190px);display:flex;gap:12px;align-items:flex-start;pointer-events:none;
  opacity:0;animation:fadein 1.6s ease 2.4s forwards;
}
#tag svg{width:26px;height:100px;overflow:visible;flex:none}
#tag path{fill:none;stroke:rgba(170,212,255,.7);stroke-width:1.1;stroke-dasharray:130;stroke-dashoffset:130;animation:trace 1.6s ease 2.4s forwards}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes tw{0%,100%{opacity:.5}50%{opacity:1}}
#tag circle{fill:#fff;filter:drop-shadow(0 0 4px rgba(140,190,255,1)) drop-shadow(0 0 9px rgba(110,170,255,.6));animation:tw 3.6s ease-in-out infinite}

#tag circle{transform-box:fill-box;transform-origin:center}
#tag circle.lit{opacity:0;animation:starin .8s ease-out both, tw 3.6s ease-in-out infinite;animation-delay:calc(2.4s + var(--r,0)*.32s), calc(3.3s + var(--r,0)*.32s)}
#tag circle.off{opacity:0;filter:none;animation:dimin .7s ease both;animation-delay:calc(2.4s + var(--r,0)*.32s)}
@keyframes starin{0%{opacity:0;transform:scale(.2)}55%{opacity:1;transform:scale(2.4)}100%{opacity:1;transform:scale(1)}}
@keyframes dimin{from{opacity:0}to{opacity:.3}}
#tag circle.pop{animation:popstar 1.4s ease-out, tw 3.6s ease-in-out 1.4s infinite}
@keyframes popstar{0%{transform:scale(1)}30%{transform:scale(3.4)}100%{transform:scale(1)}}
#tag p em{display:block;margin-top:2px;font:400 10px/1.4 var(--body);letter-spacing:.14em;font-style:normal;opacity:.65}
#tag p span{display:block}
#tag p{margin:6px 0 0;font:500 11px/28px var(--display);letter-spacing:.38em;color:rgba(222,238,255,.88);text-shadow:0 0 12px rgba(111,179,255,.65)}
.glass{
  font:500 14px/1 var(--body);color:var(--ice);padding:10px 16px;border-radius:999px;cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(2,8,30,.4);
}
.glass:hover{background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.1))}

#labels{position:fixed;inset:0;pointer-events:none}
.label{
  position:absolute;transform:translate(-50%,10px);text-align:center;pointer-events:none;
  padding:10px 18px 11px;border-radius:22px;border:1px solid var(--line);color:var(--ice);font-family:var(--body);cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 34px rgba(2,8,30,.45);
  opacity:0;transition:opacity .9s ease,transform .9s ease,background .25s;
}
.label b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.label small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
#labels.on .label{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#labels.on .label:nth-child(2){transition-delay:.12s}
#labels.on .label:nth-child(3){transition-delay:.24s}
#labels.on .label:nth-child(4){transition-delay:.36s}
.label:hover{background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.1))}

#tag{transition:opacity .6s ease}
#tag.off{opacity:0!important;pointer-events:none}
#sub{position:fixed;left:0;right:0;top:calc(7vh + env(safe-area-inset-top));text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s ease .5s}
#sub.on{opacity:1}
#sub b{display:block;font:600 12px/1 var(--display);letter-spacing:.42em;text-indent:.42em;color:rgba(222,238,255,.92);text-shadow:0 0 14px rgba(111,179,255,.7)}
#sub small{display:block;margin-top:10px;font:300 14px/1 var(--body);letter-spacing:.24em;text-indent:.24em;color:rgba(222,238,255,.7)}
#me{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .5s ease;will-change:transform}
#me span{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:500 11px/1 var(--body);letter-spacing:.1em;color:var(--ice);white-space:nowrap}
#me i{width:7px;height:7px;border-radius:50%;background:#8FD3FF}
#me.hot{pointer-events:auto}
#me button{display:none;margin-left:2px;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:var(--ice);font:500 10.5px/1 var(--body);cursor:pointer}
#me.hot button{display:inline-block}
.acts{display:flex;gap:8px;align-items:center;pointer-events:none}
#login{pointer-events:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
#login img{width:22px;height:22px;border-radius:50%}
#bar:not(.on) #back{display:none}
#umenu{position:fixed;right:clamp(18px,3.4vw,52px);top:calc(74px + env(safe-area-inset-top));padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:none;flex-direction:column;gap:10px;font:400 12px var(--body);color:var(--muted);box-shadow:0 18px 40px rgba(2,8,30,.45);z-index:5}
#umenu.on{display:flex}
#umenu button{padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--ice);font:500 13px var(--body);cursor:pointer}
#plp{position:fixed;right:clamp(14px,3vw,40px);top:96px;width:min(360px,calc(100vw - 28px));max-height:calc(100vh - 130px);overflow:auto;padding:16px 16px 18px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 24px 50px rgba(2,8,30,.45);opacity:0;pointer-events:none;transform:translateX(18px);transition:opacity .6s ease .5s,transform .6s ease .5s}
#plp.on{opacity:1;pointer-events:auto;transform:none}
#plp .tabs{display:flex;gap:6px;margin-bottom:14px;padding:4px;border-radius:999px;background:rgba(255,255,255,.07)}
#plp .tab{flex:1;padding:8px 0;border:0;border-radius:999px;background:transparent;color:var(--muted);font:600 13px var(--body);cursor:pointer}
#plp .tab.on{background:rgba(255,255,255,.18);color:var(--ice)}
#plp .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:13px 0}
#plp .row>span{font:500 12.5px var(--body);color:var(--muted);flex:none;width:48px}
#plp .opts{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
#plp .chip{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
#plp .chip.on{border-color:#fff;box-shadow:0 0 0 2px rgba(111,179,255,.6)}
#plp .sg{padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--ice);font:500 12px var(--body);cursor:pointer}
#plp .sg.on{background:rgba(111,179,255,.35);border-color:rgba(160,205,255,.8)}
#plp input{width:100%;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:var(--ice);font:500 14px var(--body);outline:none}
#plp input:focus{border-color:rgba(160,205,255,.8)}
#plp .note{margin-top:14px;font:400 11.5px/1.6 var(--body);color:var(--muted)}
#plp .sub{margin:16px 0 6px;font:600 12px var(--body);color:var(--muted)}
#plp .vt{font:700 15px var(--body);margin-bottom:4px}
#plp .list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto;margin-bottom:10px}
#plp .li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.07)}
#plp .li b{display:block;font:600 13px var(--body)}
#plp .li small{display:block;margin-top:2px;font:400 11.5px var(--body);color:var(--muted)}
#plp .li button{padding:6px 12px;border-radius:999px;border:1px solid rgba(160,205,255,.6);background:rgba(111,179,255,.25);color:var(--ice);font:500 12px var(--body);cursor:pointer;flex:none}
#pane-pl input+.sub,#pane-pl .row+input{margin-top:6px}
#plp .bx{display:flex;gap:6px;flex:none}
#plp .li button.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
#plp .vrow{display:flex;gap:8px;margin:6px 0 2px}
#plp:not(.on){transition-delay:0s;transition-duration:.35s}
#plin{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:12px 14px 12px 12px;border-radius:20px;border:1px solid rgba(170,215,255,.55);cursor:pointer;text-align:left;color:var(--ice);overflow:hidden;
  background:radial-gradient(120% 140% at 0% 0%,rgba(140,200,255,.38),rgba(90,110,255,.18) 55%,rgba(255,140,200,.16));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 28px rgba(40,90,220,.35);transition:transform .25s ease,box-shadow .25s ease}
#plin::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-110%);animation:plsh 4.2s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes plsh{0%,62%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
#plin:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 34px rgba(60,110,255,.5)}
#plin:active{transform:scale(.985)}
#plin .pi{flex:none;width:48px;height:48px;border-radius:15px;background:rgba(8,20,60,.45);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
#plin .pi svg{width:40px;height:40px;filter:drop-shadow(0 0 6px rgba(120,190,255,.6))}
#plin .pt{flex:1;min-width:0}
#plin .pt b{display:block;font:700 15.5px/1.2 var(--body);letter-spacing:-.01em}
#plin .pt small{display:block;margin-top:4px;font:400 11.5px/1.35 var(--body);color:rgba(230,240,255,.8)}
#plin .pa{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);font:600 15px/1 var(--body);transition:transform .25s ease}
#plin:hover .pa{transform:translateX(3px)}
@media (prefers-reduced-motion:reduce){#plin::after{animation:none}}
#plp .sec{margin:18px 0 2px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font:600 11px var(--body);letter-spacing:.18em;color:rgba(190,215,255,.75)}
#plp .rg{display:flex;align-items:center;gap:10px;margin:12px 0}
#plp .rg>span{flex:none;width:68px;font:500 12.5px var(--body);color:var(--muted)}
#plp .rg em{flex:none;width:38px;text-align:right;font:600 12px var(--body);font-style:normal;color:var(--ice)}
#plp input[type=range]{flex:1;width:auto;padding:0;height:22px;border:0;background:transparent;-webkit-appearance:none;appearance:none}
#plp input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,rgba(111,179,255,.25),rgba(160,205,255,.7),rgba(111,179,255,.25))}
#plp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#EAF4FF;box-shadow:0 0 0 3px rgba(111,179,255,.45),0 2px 6px rgba(0,0,0,.4)}
#plp input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(160,205,255,.5)}
#plp input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#EAF4FF;box-shadow:0 0 0 3px rgba(111,179,255,.45)}
#plp .tab{font-size:12.5px}
#rep,#mk{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,8,30,.5);z-index:20}
#rep.on,#mk.on{display:flex}
#rep .rbox,#mk .rbox{width:min(320px,calc(100vw - 40px));padding:20px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07));backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 50px rgba(2,8,30,.55)}
#rep .rbox>b,#mk .rbox>b{font:700 15px var(--body);text-align:center}
#mk p{font:400 12.5px/1.6 var(--body);color:var(--muted);text-align:center;margin:0}
#mk input{width:100%;padding:11px 13px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--ice);font:500 15px var(--body);outline:none;text-align:center}
#mk input::placeholder{color:rgba(226,236,255,.74)}

function buy(G,id,n){let c=0;while(c<n){const o=costOf(id,G.lv[id]);let ok=true;for(const k in o)if(G.res[k]<o[k])ok=false;if(!ok)break;for(const k in o)G.res[k]-=o[k];G.lv[id]++;c++}return c}
const canAdv=G=>G.era<4&&G.res.R>=CONFIG.req[G.era].R&&G.pop>=CONFIG.req[G.era].pop;
function advance(G){if(!canAdv(G))return false;G.res.R-=CONFIG.req[G.era].R;G.era++;S.shards+=CONFIG.shardEra;if(G.era===4)G.launched=true;return true}
function newG(planet,race){return{planet,race,res:{F:CONFIG.start.F,M:CONFIG.start.M,R:CONFIG.start.R},pop:CONFIG.popStart,lv:Object.assign({},CONFIG.start.lv),era:0,playSec:0,lastSeen:Date.now(),launched:false}}

function rollPlanet(seed){seed=seed==null?Math.floor(Math.random()*1e9):seed;const r=rng(seed);const type=PLANETS[(r()*PLANETS.length)|0].id;S.pend={type,seed,name:'코스미아-'+seed.toString(36).slice(0,3).toUpperCase(),ring:r()<.45?1+((r()*5)|0):0,moons:(r()*4)|0,ax:-35+((r()*70)|0),at:10+((r()*40)|0)}}

function initRace(){S.pick={temper:null,body:null,metab:null,color:0,name:NAMES[(Math.random()*NAMES.length)|0]};const P=S.pend,T=PL[P.type];

${TR.map(g=>`<h3>${g.n}</h3><div class="grid">${g.list.map(o=>`<button class="opt" data-act="pick" data-g="${g.g}" data-id="${o.id}"><b>${o.ico} ${o.n}</b><div class="mods">${modsHTML(o.mods)}</div></button>`).join('')}</div>`).join('')}
<h3>문명의 빛 색상 <span class="mut" style="font-weight:400">(능력치 영향 없음)</span></h3><div class="row" style="justify-content:flex-start">${COLORS.map((c,i)=>`<button class="sw" data-act="color" data-i="${i}" style="background:${c}"></button>`).join('')}</div><div style="height:8px"></div></div>
<div id="sum" class="card" style="border-radius:14px 14px 0 0"></div>`;

const dn=Object.entries(t).filter(e=>e[1]<0).sort((a,b)=>a[1]-b[1]),up=Object.entries(t).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);

${Object.keys(CONFIG.b).map(id=>`<div class="card bld"><div><span class="nm">${CONFIG.b[id].ico} ${CONFIG.b[id].n}</span> <span class="tag" id="L_${id}"></span><div class="cost" id="E_${id}"></div></div><button class="btn sm" data-act="buy" data-id="${id}" id="B_${id}"></button></div>`).join('')}
<details class="card" style="margin-top:8px"><summary>종족·행성 보정 보기</summary><div class="mods" id="modsum" style="margin-top:8px"></div></details>`;
const r=G.race,t=totalsOf(G.planet.type,r),dn=Object.entries(t).filter(e=>e[1]!==0).sort((a,b)=>a[1]-b[1]);$('modsum').innerHTML=dn.map(([k,v])=>modLine(k,v)).join('')+'<div class="mut" style="font-weight:400;font-size:12px;margin-top:4px">전투력·교류 보상은 해당 콘텐츠가 열릴 때 적용됩니다.</div>'}
function refreshPlay(){const G=S.G;if(!G)return;const r=rates(G),req=CONFIG.req[G.era],e=CONFIG.eras[G.era];
$('who').textContent=`${G.race.name}족 · ${G.planet.name}`;$('rF').textContent=fmt(G.res.F);$('rM').textContent=fmt(G.res.M);$('rR').textContent=fmt(G.res.R);$('rP').textContent=Math.floor(G.pop);$('rS').textContent=fmt(S.shards);
$('rFs').textContent='+'+fmt(r.F)+'/s';$('rMs').textContent='+'+fmt(r.M)+'/s';$('rRs').textContent='+'+fmt(r.R)+'/s';$('rPs').textContent='한계 '+r.cap;
if(req){const pr=Math.min(1,G.res.R/req.R);$('eraC').innerHTML=`<div class="row"><b>${e.ico} ${e.n}</b><span class="mut">생산 ×${r.em.toFixed(2)}</span></div><div class="bar"><i style="width:${pr*100}%"></i></div><div class="row"><span class="cost">연구 ${fmt(G.res.R)}/${req.R} · 인구 ${Math.floor(G.pop)}/${req.pop}</span><button class="btn sm" data-act="advance" ${canAdv(G)?'':'disabled'}>${G.era===3?'🚀 우주 진출':'발전'}</button></div>`}
else $('eraC').innerHTML=`<div class="row"><b>${e.ico} ${e.n}</b><span class="mut">생산 ×${r.em.toFixed(2)}</span></div><div class="cost" style="margin-top:4px">본진은 계속 성장합니다. 새 행성 탐색·교류는 다음 단계에서 열립니다.</div>`;
document.querySelectorAll('[data-act=qty]').forEach(b=>b.style.outline=(''+S.qty===b.dataset.q)?'2px solid var(--ac)':'none');
for(const id in CONFIG.b){const b=CONFIG.b[id],L=G.lv[id];$('L_'+id).textContent='Lv '+L;
const unit=id==='house'?0:b.rate*mult(r.t,{F:'food',M:'mineral',R:'research'}[b.out])*r.pf*r.em;
$('E_'+id).textContent=id==='house'?`인구 한계 ${r.cap} → ${Math.floor((CONFIG.capBase+CONFIG.capHouse*(L+1))*(1+CONFIG.capEra*G.era))}`:`${b.out==='F'?'식량':b.out==='M'?'광물':'연구'} ${fmt(L*unit)}/s → ${fmt((L+1)*unit)}/s`;
let n=S.qty==='max'?999:S.qty,tot={},L2=L,cnt=0,av=Object.assign({},G.res);
while(cnt<n){const o=costOf(id,L2);let ok=true;for(const k in o)if(av[k]<o[k])ok=false;if(!ok&&cnt>0)break;if(!ok&&cnt===0){for(const k in o)tot[k]=o[k];break}for(const k in o){av[k]-=o[k];tot[k]=(tot[k]||0)+o[k]}L2++;cnt++;if(n===999&&cnt>400)break}
const aff=Object.keys(tot).every(k=>G.res[k]>=tot[k]);$('B_'+id).innerHTML=Object.entries(tot).map(([k,v])=>({F:'🌾',M:'🪨'}[k])+fmt(v)).join(' ');$('B_'+id).disabled=!aff||cnt===0&&!aff}}
function offlineGain(G){const away=Math.min((Date.now()-G.lastSeen)/1000,CONFIG.offlineMax);if(away<60)return;const b=Object.assign({},G.res),p0=G.pop;tickEcon(G,away,CONFIG.offlineRate);
modal(`<b style="font-size:16px">🌙 휴식 보너스</b><div class="mut" style="margin:6px 0 10px">자리를 비운 ${Math.floor(away/60)}분 동안 문명이 성장했습니다.</div><div class="col"><div class="row"><span>🌾 식량</span><b class="up">+${fmt(G.res.F-b.F)}</b></div><div class="row"><span>🪨 광물</span><b class="up">+${fmt(G.res.M-b.M)}</b></div><div class="row"><span>🔬 연구</span><b class="up">+${fmt(G.res.R-b.R)}</b></div><div class="row"><span>👥 인구</span><b class="up">+${Math.floor(G.pop-p0)}</b></div><button class="btn" data-act="close">확인</button></div>`)}
function settings(){modal(`<b style="font-size:16px">설정</b><div class="col" style="margin-top:10px"><button class="btn sub" data-act="mute">${S.mute?'🔇 소리 꺼짐':'🔊 소리 켜짐'}</button><button class="btn sub" data-act="reset" id="rstb">🗑 처음부터 다시 시작</button><button class="btn" data-act="close">닫기</button></div>`)}

// ===== 입력 =====
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;unlockAudio();const a=b.dataset.act;
if(a==='enter')enter();else if(a==='close')closeModal();
else if(a==='reroll')openReroll();
else if(a==='reroll-shard'){const c=rerollCost();if(S.shards>=c){S.shards-=c;doReroll()}}
else if(a==='reroll-cash')doReroll();
else if(a==='planet-ok'){setScene('race');initRace();beep(440,.2,'sine',.05,660)}
else if(a==='pick'){S.pick[b.dataset.g]=b.dataset.id;beep(520,.06,'sine',.04);updRace()}
else if(a==='color'){S.pick.color=+b.dataset.i;updRace()}
else if(a==='race-ok'){startGame()}
else if(a==='qty'){S.qty=b.dataset.q==='max'?'max':+b.dataset.q;refreshPlay()}
else if(a==='buy'){const n=S.qty==='max'?999:S.qty,c=buy(S.G,b.dataset.id,n);if(c)beep(600+c*10,.08,'triangle',.05);refreshPlay();persist()}
else if(a==='advance'){if(advance(S.G)){boom();toast(S.G.era===4?'🚀 우주로 진출합니다':'✨ '+CONFIG.eras[S.G.era].n+' 도달! 생산량 증가');persist();if(S.G.era===4){setScene('launch');S.parts=[]}else refreshPlay()}}
else if(a==='back-home'){enterPlay()}
else if(a==='settings')settings();
else if(a==='mute'){S.mute=!S.mute;persist();settings()}
else if(a==='reset'){if(b.dataset.s){store.clear();S.G=null;S.shards=0;S.rerolls=0;closeModal();resetHome();setScene('galaxy')}else{b.dataset.s=1;b.textContent='⚠ 한 번 더 누르면 모든 진행이 삭제됩니다'}}});

function spawnBang(){const r=rng(S.pend.seed),T=PL[S.pend.type],cols=[...T.pal,...T.blob,'#ffffff','#ffe6b0'],k=Math.min(W,H)/700;S.parts=[];for(let i=0;i<420;i++){const a=r()*6.2832,v=(60+r()*520)*k;S.parts.push({x:0,y:0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[(r()*cols.length)|0],s:1+r()*2})}}
function update(dt){S.st+=dt;S.T+=dt;Z.intro=Math.min(1,Z.intro+dt/2.8);if(Z.prog!==Z.target)Z.prog=Z.target>Z.prog?Math.min(Z.target,Z.prog+dt/3):Math.max(Z.target,Z.prog-dt/2.4);
if(S.scene==='zoom'&&Z.prog>=1){rollPlanet(S.seedOverride);S.seedOverride=null;setScene('bang')}
else if(S.scene==='bang'){const t=S.st;if(t>.95&&!S.boomed){S.boomed=true;boom();spawnBang()}
if(S.parts){const pull=t>2.6?clamp((t-2.6)/1.6,0,1):0;for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;const dm=Math.pow(.5,dt*1.6);p.vx*=dm;p.vy*=dm;if(pull){p.vx-=p.x*pull*9*dt;p.vy-=p.y*pull*9*dt}}}
if(t>5.2){renderPlanet();setScene('planet')}}
else if(S.scene==='launch'){if(S.st>5)$('s-launch').classList.add('show');if(S.st>.6&&S.st<3.2&&S.parts)for(let i=0;i<4;i++)S.parts.push({x:(Math.random()-.5)*8,y:0,vx:(Math.random()-.5)*40,vy:80+Math.random()*80,l:1,c:Math.random()<.5?'#ffb347':'#fff'});if(S.parts){for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.y+=p.vy*dt;p.x+=p.vx*dt;p.l-=dt;if(p.l<=0)S.parts.splice(i,1)}}}
if(S.flash)S.flash=Math.max(0,S.flash-dt*2);
if((S.scene==='play'||S.scene==='launch')&&S.G){tickEcon(S.G,dt);const G=S.G;G.lastSeen=Date.now();S.shardAcc=(S.shardAcc||0)+dt;if(S.shardAcc>=60){S.shardAcc-=60;S.shards+=CONFIG.shardMin}
S.uiT+=dt;if(S.uiT>.25&&S.scene==='play'){S.uiT=0;refreshPlay()}S.saveT+=dt;if(S.saveT>5){S.saveT=0;persist()}}}

// ===== 렌더 (LHY 엔진 사용) =====
const Z={prog:0,target:0,intro:0,hover:0,over:false};
let W=innerWidth,H=innerHeight,dpr=1;
function relayout(){X.layout();W=X.W;H=X.H;dpr=X.dpr}
addEventListener('resize',relayout);relayout();
const cfgOf=P=>({p:PL[P.type].p,ty:PL[P.type].ty,r:P.ring||0,rc:0,rs:1,m:P.moons||0,ax:P.ax==null?-18:P.ax,at:P.at==null?16:P.at,ss:1,sd:0});
function planetPos(){const top=158,bot=H*.52,R=clamp(Math.min(W*.28,(bot-top)*.42),46,150);return{x:W/2,y:(top+bot)/2,R}}
function drawLights(x,y,R,P,t,n,col){const g=X.ctx;g.save();g.scale(dpr,dpr);g.beginPath();g.arc(x,y,R,0,6.2832);g.clip();const r2=rng(P.seed+99);let c=0,tr=0;g.fillStyle=col;while(c<n&&tr<4000){tr++;const a=r2()*6.2832,d=Math.sqrt(r2())*R*.95,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;if((px-x)+(py-y)<R*.1)continue;c++;g.globalAlpha=.55+.45*Math.sin(t*2+c);g.fillRect(px,py,2,2)}g.restore()}
function skipIntro(){Z.prog=Z.target=1;Z.intro=1;const d=document;d.getElementById('welcome').classList.add('hide');d.getElementById('tag').classList.add('off');d.getElementById('bar').classList.add('on')}
function resetHome(){Z.prog=Z.target=0;Z.intro=0;const d=document;d.getElementById('welcome').classList.remove('hide');d.getElementById('tag').classList.remove('off');d.getElementById('bar').classList.remove('on')}
const sky=X.cv;
sky.addEventListener('pointermove',e=>{const o=S.scene==='galaxy'&&X.hitMain(e.clientX,e.clientY);Z.over=!!o;sky.classList.toggle('go',!!o)});
sky.addEventListener('pointerdown',e=>{unlockAudio();if(S.scene==='galaxy'){if(X.hitMain(e.clientX,e.clientY))enter()}else if(S.scene==='bang'&&S.st>1.4)S.st=Math.max(S.st,5.3)});
function draw(dt){
const g=X.ctx,cvs=X.cv,t=S.T,sc=S.scene,st=S.st;
g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.clearRect(0,0,cvs.width,cvs.height);
const e=X.ease(Z.prog);
X.drawBG(e,Z.intro,t,dt);
if(sc==='galaxy'||sc==='zoom'){Z.hover+=((sc==='galaxy'&&Z.over?1:0)-Z.hover)*.1;X.drawHome(e,Z.intro,t,1,Z.hover)}
else if(sc==='bang'){
const cx=W/2,cy=H*.42,T=PL[S.pend.type],M=Math.min(W,H);
g.save();g.scale(dpr,dpr);
if(st<1){const r=3+st*12+Math.sin(st*40)*1.5,gr=g.createRadialGradient(cx,cy,0,cx,cy,r*5);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(150,180,255,0)');g.fillStyle=gr;g.fillRect(cx-r*5,cy-r*5,r*10,r*10)}
if(st>.95){const e2=st-.95;for(let k=0;k<3;k++){const rr=(e2-k*.25)*M*.55;if(rr>0){g.strokeStyle=rgba(T.pal[0],clamp(.7-rr/M*.8,0,.7));g.lineWidth=3;g.beginPath();g.arc(cx,cy,rr,0,6.2832);g.stroke()}}
const ng=g.createRadialGradient(cx,cy,0,cx,cy,M*.5*ease(e2/2));ng.addColorStop(0,rgba(T.pal[1],.35*clamp(1-e2/3.5,0,1)));ng.addColorStop(1,rgba(T.pal[2],0));g.fillStyle=ng;g.fillRect(0,0,W,H)}
if(S.parts){g.globalCompositeOperation='lighter';for(const p of S.parts){g.fillStyle=p.c;g.globalAlpha=st>3.6?clamp(1-(st-3.6)/1.2,0,1):1;g.fillRect(cx+p.x,cy+p.y,p.s,p.s)}g.globalAlpha=1;g.globalCompositeOperation='source-over'}
g.restore();
if(st>3.2){const R=Math.min(W*.3,H*.17,150)*ease((st-3.2)/1.6);if(R>1)X.planet(cx,cy,R,cfgOf(S.pend),t,dt)}
if(st>.9&&st<1.6){g.save();g.scale(dpr,dpr);g.fillStyle='rgba(255,255,255,'+(1-(st-.9)/.7)+')';g.fillRect(0,0,W,H);g.restore()}
}
else if(sc==='planet'){const R=Math.min(W*.3,H*.17,150);X.planet(W/2,H*.3,R,cfgOf(S.pend),t,dt);if(S.flash){g.save();g.scale(dpr,dpr);g.fillStyle='rgba(255,255,255,'+S.flash+')';g.fillRect(0,0,W,H);g.restore()}}
else if(sc==='race'){X.planet(W/2,112,36,cfgOf(S.pend),t,dt)}
else if(sc==='play'&&S.G){const G=S.G,pp=planetPos();X.planet(pp.x,pp.y,pp.R,cfgOf(G.planet),t,dt);drawLights(pp.x,pp.y,pp.R,G.planet,t,Math.min(140,Math.floor(G.pop*.7+G.era*12)),COLORS[G.race.color])}
else if(sc==='launch'&&S.G){const G=S.G,pp=planetPos();
if(st<3.4){X.planet(pp.x,pp.y,pp.R,cfgOf(G.planet),t,dt);drawLights(pp.x,pp.y,pp.R,G.planet,t,100,COLORS[G.race.color]);const ry=pp.y-pp.R*.7-Math.max(0,st-.6)*Math.max(0,st-.6)*120;
g.save();g.scale(dpr,dpr);g.translate(pp.x,ry);if(S.parts)for(const p of S.parts){g.globalAlpha=clamp(p.l,0,1);g.fillStyle=p.c;g.fillRect(p.x-2,p.y+14,4,4)}g.globalAlpha=1;g.restore();
X.ship(pp.x,ry,-Math.PI/2,26,t,1.6)}
if(st>2.6){const a=clamp((st-2.6)/1.2,0,1);X.drawHome(0,1,t,a,0);g.save();g.scale(dpr,dpr);g.globalAlpha=a;const hx=X.mcx+X.mainR*.3,hy=X.mcy+X.mainR*.1,pu=1+.5*Math.sin(t*3),gr=g.createRadialGradient(hx,hy,0,hx,hy,14*pu);gr.addColorStop(0,'rgba(120,230,255,1)');gr.addColorStop(1,'rgba(120,230,255,0)');g.fillStyle=gr;g.fillRect(hx-20,hy-20,40,40);g.fillStyle='#cfe3ff';g.font='12px Pretendard Variable,system-ui,sans-serif';g.textAlign='left';g.fillText('본진',hx+12,hy+4);g.restore()}
}
}

// ===== 루프: 고정 타임스텝 =====
const STEP=1/60;let acc=0,last=performance.now(),errc=0;
function frame(now){const raw=Math.min((now-last)/1000,.1);last=now;acc+=raw;while(acc>=STEP){update(STEP);acc-=STEP}try{draw(raw)}catch(err){X.cv.width=X.cv.width;if(errc++<3)console.error(err)}requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();else if(S.G&&S.scene==='play'){offlineGain(S.G);refreshPlay()}});
addEventListener('pagehide',persist);

// ===== 시작 =====
X.init();setTimeout(()=>document.getElementById('welcome').classList.add('show'),60);[0,1,3,2,4,5].forEach((ci,rank)=>{const c=document.querySelectorAll('#tag circle')[ci];if(c){c.style.setProperty('--r',rank);c.classList.add('lit')}});
(function boot(){const FR=true;if(FR)S.noSave=true;const d=FR?null:store.get();if(d&&d.version===1){S.shards=d.shards||0;S.rerolls=d.rerolls||0;S.mute=!!d.mute;if(d.G){S.G=d.G;skipIntro();enterPlay();offlineGain(S.G);refreshPlay();return}}setScene('galaxy')})();
requestAnimationFrame(frame);

// ===== 테스트 훅 (삭제 금지) =====
window.__game={state:S,CONFIG,input:{_p:{}},core:{rates,tickEcon,costOf,buy,canAdv,advance,newG,totalsOf,capOf,PLANETS,TR,rollPlanet},
step(n=1){for(let i=0;i<n;i++)update(STEP)},
press(k){if(k==='action'){if(S.scene==='galaxy')enter();else if(S.scene==='bang')S.st=Math.max(S.st,5.3)}},
reset(seed){S.noSave=false;store.clear();S.G=null;S.shards=0;S.rerolls=0;S.seedOverride=seed;closeModal();resetHome();setScene('galaxy')}};

</script>
